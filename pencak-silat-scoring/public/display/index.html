<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display - Pencak Silat Scoring</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="/display/display.css">
</head>
<body>
<div id="no-match" class="hidden min-h-screen grid place-items-center text-center bg-slate-950 text-white"><div><p class="text-4xl font-black tracking-wide">MENUNGGU PARTAI</p><p class="text-slate-400 mt-3 text-lg">Aktifkan partai dari halaman Admin.</p></div></div>
<div id="content" class="hidden board">
<header class="top"><div class="top-side"><span class="brand-mark">PS</span><span>GELANGGANG A</span></div><div class="title">PENYISIHAN</div><div class="top-side top-side-right"><span id="kelas-label">TANDING KELAS - A Dewasa</span><span class="brand-mark">PS</span></div></header>
<section class="head"><div class="fighter"><span class="flag-id" aria-label="Indonesia"></span><div class="avatar blue"><img src="/shared/icons/standing.png" alt="Atlet biru"></div><div><p id="biru-nama" class="name">Pesilat X</p><p class="label">KONTINGEN</p><p id="biru-kontingen" class="camp">Kontingen X</p></div></div><div class="timer"><div id="timer-display">00:00</div></div><div class="fighter right"><div><p id="merah-nama" class="name">Pesilat IX</p><p class="label">KONTINGEN</p><p id="merah-kontingen" class="camp">Kontingen IX</p></div><div class="avatar red"><img src="/shared/icons/standing.png" alt="Atlet merah"></div><span class="flag-id" aria-label="Indonesia"></span></div></section>
<main class="main"><section class="corner-panel blue-panel"><div class="gesture-grid" aria-label="Gesture poin biru"><div class="cell"><img src="/shared/icons/one-finger.png" alt="Satu jari"></div><div class="cell"><img src="/shared/icons/one-finger.png" alt="Satu jari"></div><div class="cell"><img src="/shared/icons/two-finger.png" alt="Dua jari"></div><div class="cell"><img src="/shared/icons/two-finger.png" alt="Dua jari"></div><div class="cell"><img src="/shared/icons/punch.png" alt="Pukulan"></div><div class="cell"><img src="/shared/icons/punch.png" alt="Pukulan"></div></div><section class="score blue"><div id="biru-skor" class="num">0</div><div id="biru-hukuman" class="penalty"></div></section></section><div class="middle-column"><div class="round-panel"><div class="round now">I</div><div class="round">II</div><div class="round">III</div><div class="round">Round <span id="round-label">1</span></div></div><div class="action-icons"><img src="/shared/icons/punch.png" alt="Pukulan"><img src="/shared/icons/kick.png" alt="Tendangan"></div></div><section class="corner-panel red-panel"><section class="score red"><div id="merah-skor" class="num">0</div><div id="merah-hukuman" class="penalty"></div></section><div class="gesture-grid" aria-label="Gesture poin merah"><div class="cell"><img src="/shared/icons/one-finger.png" alt="Satu jari"></div><div class="cell"><img src="/shared/icons/one-finger.png" alt="Satu jari"></div><div class="cell"><img src="/shared/icons/two-finger.png" alt="Dua jari"></div><div class="cell"><img src="/shared/icons/two-finger.png" alt="Dua jari"></div><div class="cell"><img src="/shared/icons/punch.png" alt="Pukulan"></div><div class="cell"><img src="/shared/icons/punch.png" alt="Pukulan"></div></div></section></main>
<section class="judges"><div class="judge">J1</div><div class="judge">J2</div><div class="judge">J3</div><div class="judge-action"><img src="/shared/icons/punch.png" alt="Pukulan"></div><div class="judge">J1</div><div class="judge">J2</div><div class="judge">J3</div><div class="judge">J1</div><div class="judge">J2</div><div class="judge">J3</div><div class="judge-action"><img src="/shared/icons/kick.png" alt="Tendangan"></div><div class="judge">J1</div><div class="judge">J2</div><div class="judge">J3</div></section>
<div id="poin-indicator" class="hidden"><div id="poin-text" class="score-pop"></div></div>
</div>
<div id="winner-overlay" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50 text-white"><div class="text-center"><p class="text-3xl text-slate-300 mb-4">PEMENANG</p><p id="winner-name" class="text-7xl font-black mb-3">-</p><p id="winner-method" class="text-2xl text-amber-400">-</p></div></div>
<script src="/display/display.js"></script>
</body>
</html>
