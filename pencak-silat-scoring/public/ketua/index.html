<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ketua Pertandingan</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">

<div id="no-match" class="hidden flex items-center justify-center min-h-screen text-center p-6">
  <div>
    <p class="text-2xl text-slate-500 font-semibold">Menunggu partai aktif...</p>
    <p class="text-slate-400 mt-2">Admin belum mengaktifkan partai.</p>
  </div>
</div>

<div id="content" class="hidden max-w-5xl mx-auto p-4 md:p-6">
  <header class="text-center mb-5">
    <p class="text-slate-500 text-sm">Babak <span id="round-label">1</span></p>
    <h1 id="match-title" class="text-xl md:text-2xl font-bold text-slate-800">-</h1>
    <div class="flex justify-center gap-8 mt-2 text-lg font-bold">
      <span class="text-red-600">MERAH: <span id="skor-merah">0</span></span>
      <span class="text-blue-600">BIRU: <span id="skor-biru">0</span></span>
    </div>
    <div class="mt-3 inline-flex items-center gap-2 rounded-lg bg-slate-800 px-4 py-1.5 text-white">
      <span class="text-xs uppercase tracking-widest text-slate-300">Waktu</span>
      <span id="timer-display" class="font-mono text-2xl font-black tabular-nums">00:00</span>
      <span id="timer-status" class="text-xs text-emerald-300">SIAP</span>
    </div>
  </header>

  <!-- HUKUMAN & JATUHAN -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="font-semibold text-red-700 mb-3">Sudut Merah — Hukuman / Jatuhan</h2>
      <div class="grid grid-cols-2 gap-2">
        <button data-sudut="merah" data-jenis="binaan" class="hukuman-btn bg-slate-200 hover:bg-slate-300 rounded-lg py-2 text-sm font-medium">Binaan (0)</button>
        <button data-sudut="merah" data-jenis="teguran1" class="hukuman-btn bg-amber-200 hover:bg-amber-300 rounded-lg py-2 text-sm font-medium">Teguran 1 (-1)</button>
        <button data-sudut="merah" data-jenis="teguran2" class="hukuman-btn bg-amber-300 hover:bg-amber-400 rounded-lg py-2 text-sm font-medium">Teguran 2 (-2)</button>
        <button data-sudut="merah" data-jenis="peringatan1" class="hukuman-btn bg-orange-400 hover:bg-orange-500 text-white rounded-lg py-2 text-sm font-medium">Peringatan 1 (-5)</button>
        <button data-sudut="merah" data-jenis="peringatan2" class="hukuman-btn bg-red-600 hover:bg-red-700 text-white rounded-lg py-2 text-sm font-medium col-span-2">Peringatan 2 (-10)</button>
        <button data-sudut="merah" class="jatuhan-btn bg-green-600 hover:bg-green-700 text-white rounded-lg py-2 text-sm font-bold col-span-2">⬇ Jatuhan Merah (+3)</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="font-semibold text-blue-700 mb-3">Sudut Biru — Hukuman / Jatuhan</h2>
      <div class="grid grid-cols-2 gap-2">
        <button data-sudut="biru" data-jenis="binaan" class="hukuman-btn bg-slate-200 hover:bg-slate-300 rounded-lg py-2 text-sm font-medium">Binaan (0)</button>
        <button data-sudut="biru" data-jenis="teguran1" class="hukuman-btn bg-amber-200 hover:bg-amber-300 rounded-lg py-2 text-sm font-medium">Teguran 1 (-1)</button>
        <button data-sudut="biru" data-jenis="teguran2" class="hukuman-btn bg-amber-300 hover:bg-amber-400 rounded-lg py-2 text-sm font-medium">Teguran 2 (-2)</button>
        <button data-sudut="biru" data-jenis="peringatan1" class="hukuman-btn bg-orange-400 hover:bg-orange-500 text-white rounded-lg py-2 text-sm font-medium">Peringatan 1 (-5)</button>
        <button data-sudut="biru" data-jenis="peringatan2" class="hukuman-btn bg-red-600 hover:bg-red-700 text-white rounded-lg py-2 text-sm font-medium col-span-2">Peringatan 2 (-10)</button>
        <button data-sudut="biru" class="jatuhan-btn bg-green-600 hover:bg-green-700 text-white rounded-lg py-2 text-sm font-bold col-span-2">⬇ Jatuhan Biru (+3)</button>
      </div>
    </div>
  </div>

  <!-- VERIFIKASI -->
  <div class="bg-white rounded-xl shadow p-4 mb-5">
    <h2 class="font-semibold text-slate-700 mb-3">Verifikasi</h2>
    <div class="flex gap-2 flex-wrap mb-4">
      <button data-tipe="jatuhan" class="trigger-verif-btn bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">Picu Verifikasi Jatuhan</button>
      <button data-tipe="pelanggaran" class="trigger-verif-btn bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">Picu Verifikasi Pelanggaran</button>
    </div>

    <div id="verif-panel" class="hidden border rounded-lg p-3 bg-slate-50">
      <p id="verif-status" class="text-sm text-slate-600 mb-2">Menunggu vote juri...</p>
      <div id="verif-tally" class="grid grid-cols-3 gap-2 text-center mb-3">
        <div class="bg-white rounded p-2 border"><p class="text-xs text-slate-400">Juri 1</p><p id="vote-1" class="font-bold">-</p></div>
        <div class="bg-white rounded p-2 border"><p class="text-xs text-slate-400">Juri 2</p><p id="vote-2" class="font-bold">-</p></div>
        <div class="bg-white rounded p-2 border"><p class="text-xs text-slate-400">Juri 3</p><p id="vote-3" class="font-bold">-</p></div>
      </div>
      <div class="flex gap-2 flex-wrap">
        <button data-hasil="merah" class="confirm-verif-btn bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded text-sm">Konfirmasi: Merah</button>
        <button data-hasil="biru" class="confirm-verif-btn bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded text-sm">Konfirmasi: Biru</button>
        <button data-hasil="invalid" class="confirm-verif-btn bg-slate-500 hover:bg-slate-600 text-white px-3 py-2 rounded text-sm">Konfirmasi: Invalid</button>
        <button id="cancel-verif-btn" class="bg-slate-300 hover:bg-slate-400 px-3 py-2 rounded text-sm">Batalkan</button>
      </div>
      <label class="flex items-center gap-2 mt-3 text-sm">
        <input type="checkbox" id="terapkan-skor-jatuhan"> Terapkan +3 poin jatuhan ke sudut terpilih saat konfirmasi
      </label>
    </div>
  </div>

  <!-- KEPUTUSAN PEMENANG -->
  <div class="bg-white rounded-xl shadow p-4">
    <h2 class="font-semibold text-slate-700 mb-2">Keputusan Pemenang</h2>
    <p id="rekomendasi" class="text-sm text-slate-500 mb-3">Rekomendasi otomatis: -</p>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <div>
        <label class="text-xs text-slate-500">Pemenang</label>
        <select id="pemenang-select" class="w-full border rounded-lg px-3 py-2 mt-1">
          <option value="merah">Sudut Merah</option>
          <option value="biru">Sudut Biru</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-500">Metode Menang</label>
        <select id="metode-select" class="w-full border rounded-lg px-3 py-2 mt-1">
          <option value="Angka">Menang Angka</option>
          <option value="Teknik">Menang Teknik</option>
          <option value="Diskualifikasi">Diskualifikasi</option>
          <option value="Mutlak">Mutlak</option>
          <option value="RSC">RSC</option>
          <option value="WO">WO (Walk Over)</option>
        </select>
      </div>
    </div>
    <button id="submit-winner-btn" class="mt-4 bg-slate-800 hover:bg-slate-900 text-white px-5 py-3 rounded-lg font-bold w-full">Sahkan Pemenang & Selesaikan Partai</button>
  </div>

</div>

<script src="/ketua/ketua.js"></script>
</body>
</html>
