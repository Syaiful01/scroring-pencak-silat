<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Digital Scoring Pencak Silat</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="max-w-6xl mx-auto p-4 md:p-8">

  <header class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Panitia / Admin</h1>
      <p class="text-slate-500 text-sm">Kelola jadwal partai pertandingan pencak silat</p>
    </div>
    <span id="conn-status" class="text-xs font-semibold px-3 py-1 rounded-full bg-red-100 text-red-700">Menghubungkan...</span>
  </header>

  <!-- FORM TAMBAH / EDIT -->
  <div class="bg-white rounded-xl shadow p-5 mb-6">
    <h2 id="form-title" class="font-semibold text-lg mb-4 text-slate-700">Tambah Partai Baru</h2>
    <form id="match-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input type="hidden" id="match-id">

      <div>
        <label class="text-xs font-medium text-slate-500">Nomor Partai</label>
        <input type="text" id="nomor_partai" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="Partai 01">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500">Kelas Tanding</label>
        <input type="text" id="kelas" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="Kelas A Putra">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-500">Durasi Round (detik)</label>
        <input type="number" id="durasi_round" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="120" required>
      </div>

      <div>
        <label class="text-xs font-medium text-slate-500">Jumlah Babak</label>
        <input type="number" id="babak_max" class="w-full border rounded-lg px-3 py-2 mt-1" value="3" min="1" max="5">
      </div>
      <div></div>
      <div></div>

      <div class="bg-red-50 rounded-lg p-3 border border-red-200">
        <p class="text-xs font-bold text-red-700 mb-2">SUDUT MERAH</p>
        <input type="text" id="merah_nama" class="w-full border rounded-lg px-3 py-2 mb-2" placeholder="Nama Atlet" required>
        <input type="text" id="merah_kontingen" class="w-full border rounded-lg px-3 py-2" placeholder="Kontingen/Perguruan">
      </div>
      <div class="bg-blue-50 rounded-lg p-3 border border-blue-200">
        <p class="text-xs font-bold text-blue-700 mb-2">SUDUT BIRU</p>
        <input type="text" id="biru_nama" class="w-full border rounded-lg px-3 py-2 mb-2" placeholder="Nama Atlet" required>
        <input type="text" id="biru_kontingen" class="w-full border rounded-lg px-3 py-2" placeholder="Kontingen/Perguruan">
      </div>
      <div class="flex flex-col justify-end gap-2">
        <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white rounded-lg px-4 py-2 font-semibold">Simpan Partai</button>
        <button type="button" id="cancel-edit" class="hidden text-sm text-slate-500 underline">Batal edit</button>
      </div>
    </form>
  </div>

  <!-- DAFTAR PARTAI -->
  <div class="bg-white rounded-xl shadow p-5">
    <h2 class="font-semibold text-lg mb-4 text-slate-700">Daftar Partai</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-slate-500 border-b">
            <th class="py-2 pr-2">No</th>
            <th class="py-2 pr-2">Kelas</th>
            <th class="py-2 pr-2">Merah</th>
            <th class="py-2 pr-2">Biru</th>
            <th class="py-2 pr-2">Durasi</th>
            <th class="py-2 pr-2">Status</th>
            <th class="py-2 pr-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="match-list"></tbody>
      </table>
    </div>
  </div>

</div>
<script src="/admin/admin.js"></script>
</body>
</html>
